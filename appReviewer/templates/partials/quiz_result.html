{% block extra_css %}
    <style>
        #quizresult-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            width: 100%;
        }

    </style>
{% endblock %}

<div id="quizresult-container" class="card shadow-sm border-0 mx-auto" style="max-width: 400px;">
    <div class="card-header bg-primary text-white text-center">
        <h5 class="mb-0">Quiz Result: {{ quiz }}</h5>
    </div>
    <div class="card-body text-center">
        <h4 class="fw-bold mb-3">
            Score: <span class="text-success">{{ score }}</span> / {{ num_items }}
        </h4>
        
        <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'show_user_exams' %}" class="btn btn-success btn-sm">
                Review Other Exams
            </a>
            <button class="btn btn-primary btn-sm" 
                hx-get="{% url 'view_feedback' %}?summary_id={{ summary_id }}" 
                hx-push-url="true" 
                hx-target="#quizresult-container" 
                hx-swap="outerHTML">
                View Feedback
            </button>
        </div>
    </div>
</div>
