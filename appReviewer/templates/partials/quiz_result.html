

<div hx-boost>
    <a href="{% url 'reviewer' %}"><button class="btn btn-primary my-4">Go Back</button></a>
</div>

<div id="feedback-container" class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white text-center">
        <h5 class="mb-0">Quiz Result: {{ quiz }}</h5>
    </div>
    <div class="card-body text-center">

            <h4 class="fw-bold">
                Score: {{ score }} / {{ num_items }} 
            </h4>
            <a href="{% url 'show_user_exams' %}" class="btn btn-success">Review Other Exams</a>
            <button class="btn btn-primary" hx-get="{% url 'view_feedback' %}?summary_id={{ summary_id }}" hx-push-url="true" hx-target="#feedback-container" hx-swap="outerHTML">View Feedback</button>
    </div>
</div>
