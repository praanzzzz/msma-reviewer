



<div id="feedback-container" class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white text-center">
        <h5 class="mb-0">Quiz Result: {{ quiz }}</h5>
    </div>
    <div class="card-body text-center">

            <h4 class="fw-bold">
                Score: {{ score }} / {{ num_items }} 
            </h4>
            <a href="{% url 'reviewer' %}" class="btn btn-success">View Another Quiz</a>
            <button class="btn btn-primary" hx-get="{% url 'view_feedback' %}?summary_id={{ summary_id }}" hx-target="#feedback-container" hx-swap="outerHTML">View Feedback</button>
    </div>
</div>
