{% extends 'base.html' %}
{% load static %}
{% block content %}

<main class="container" style="min-height: 100vh; padding-top: 4rem; margin-top: 5%;">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-md navbar-light mb-4" style="background-color: transparent;">
        <div class="container justify-content-center">
            <a class="navbar-brand d-none" href="#"></a> <!-- Hidden brand for alignment -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="{% url 'profile' %}" class="nav-link active" aria-current="page">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'update_profile' %}" class="nav-link">Update Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'password_change' %}" class="nav-link">Change Password</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'billing' %}" class="nav-link">Subscription and Billing</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Profile Card -->
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-4">
            <div class="profile-card-4 z-depth-3">
                <div class="card">
                    <div class="card-body text-center bg-primary rounded-top">
                        <div class="user-box">
                            {% if user.profile_picture %}
                                <img src="{{ user.profile_picture.url }}" alt="Profile Picture"
                                    style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover;" />
                            {% else %}
                                <img src="{% static 'images/default_pp.jpg' %}" alt="Default Profile Picture"
                                    style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover;" />
                            {% endif %}
                        </div>
                    </div>
                    <div class="card-body">
                        <ul class="list-group shadow-none">
                            <li class="list-group-item text-center">
                                <i class="fa fa-envelope"></i>
                                <small class="ms-2">{{ user.email }}</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    .navbar-nav .nav-link.active {
        color: blue !important;
        position: relative;
    }

    .navbar-nav .nav-link.active::after {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background-color: blue;
        border-radius: 50%;
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
    }

    .deactivate-button {
        border-radius: 30px;
    }

    .additional-text {
        margin-left: 10px;
    }

    .btn {
        border-radius: 30px;
    }

    .card {
        box-shadow: 8px 8px 8px 8px rgba(197, 197, 197, 0.268);
        border: none;
        padding: 1rem;
    }

    .card-header {
        background-color: transparent;
        font-size: 1.25rem;
    }

    .form-label {
        font-weight: bold;
    }
</style>

{% endblock %}
